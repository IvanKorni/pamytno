# Локальное окружение «Памятно».
#   docker compose up -d postgres   — только БД, backend запускается из IDE (профиль local);
#   docker compose up -d --build    — БД и backend в контейнерах, настройки — из .env (см. .env.example).
services:
  postgres:
    image: postgres:17
    container_name: pamytno-postgres
    environment:
      POSTGRES_DB: pamytno
      POSTGRES_USER: pamytno
      POSTGRES_PASSWORD: pamytno
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pamytno -d pamytno" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: pamytno-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Без секрета приложение не стартует: JWT_SECRET задаётся в .env, не короче 32 символов.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_TTL: ${JWT_TTL:-12h}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-20MB}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_REFUSAL_FALLBACK: ${AI_REFUSAL_FALLBACK:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - storage-data:/app/storage

volumes:
  postgres-data:
  storage-data:

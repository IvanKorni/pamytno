server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pamytno
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:pamytno}
    username: ${POSTGRES_USER:pamytno}
    password: ${POSTGRES_PASSWORD:pamytno}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  modulith:
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

pamytno:
  time:
    zone: ${APP_TIME_ZONE:UTC}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:12h}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  topic:
    storage:
      root: ${STORAGE_ROOT:./storage}
    youtube:
      base-url: ${YOUTUBE_BASE_URL:https://www.youtube.com}
      preferred-languages: ${YOUTUBE_LANGUAGES:ru,en}
  deck:
    chunk-size: ${AI_CHUNK_SIZE:6000}
    ai:
      provider: ${AI_PROVIDER:stub}
      questions-per-chunk: ${AI_QUESTIONS_PER_CHUNK:8}
      anthropic:
        model: ${AI_MODEL:claude-opus-5}
        max-tokens: ${AI_MAX_TOKENS:16000}
        effort: ${AI_EFFORT:}
        refusal-fallback: ${AI_REFUSAL_FALLBACK:true}

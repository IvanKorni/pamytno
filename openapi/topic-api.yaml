openapi: 3.0.3
info:
  title: Памятно — Topic API
  description: Темы, источники материалов (PDF, YouTube, текст, список слов) и единый текст темы.
  version: 1.0.0
servers:
  - url: http://localhost:8080

tags:
  - name: Topics
    description: Темы — наборы материалов для изучения
  - name: Sources
    description: Источники материалов внутри темы
  - name: TextSources
    description: Добавление текста и списка слов
  - name: PdfSources
    description: Загрузка PDF
  - name: YoutubeSources
    description: Добавление видео YouTube
  - name: TopicContent
    description: Единый текст темы (Master Text)

paths:
  /api/topics:
    get:
      tags: [ Topics ]
      summary: Темы текущего пользователя
      operationId: listTopics
      responses:
        '200':
          description: Список тем, новые сверху
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [ Topics ]
      summary: Создать тему
      operationId: createTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopicRequest'
      responses:
        '201':
          description: Тема создана в статусе DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/topics/{topicId}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [ Topics ]
      summary: Тема по идентификатору
      operationId: getTopic
      responses:
        '200':
          description: Тема
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Topics ]
      summary: Изменить название или описание темы
      operationId: updateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopicRequest'
      responses:
        '200':
          description: Обновлённая тема
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Topics ]
      summary: Удалить тему со всеми материалами
      description: Вопросы, карточки и прогресс темы удаляются другими модулями по событию TopicDeleted.
      operationId: deleteTopic
      responses:
        '204':
          description: Тема удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/topics/{topicId}/sources:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [ Sources ]
      summary: Источники темы
      operationId: listSources
      responses:
        '200':
          description: Источники в порядке добавления
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/topics/{topicId}/sources/text:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [ TextSources ]
      summary: Добавить текст или список слов
      description: Текст сохраняется без изменений в originalText, обработка идёт асинхронно.
      operationId: addTextSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextSourceRequest'
      responses:
        '202':
          description: Источник принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/topics/{topicId}/sources/pdf:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [ PdfSources ]
      summary: Загрузить PDF
      description: Файл сохраняется в хранилище, текст извлекается асинхронно (без OCR).
      operationId: addPdfSource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ file ]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  maxLength: 255
      responses:
        '202':
          description: Файл принят в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Файл больше допустимого размера (FILE_TOO_LARGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/topics/{topicId}/sources/youtube:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    post:
      tags: [ YoutubeSources ]
      summary: Добавить видео YouTube
      description: Backend асинхронно пытается получить субтитры видео.
      operationId: addYoutubeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YoutubeSourceRequest'
      responses:
        '202':
          description: Видео принято в обработку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sources/{sourceId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [ Sources ]
      summary: Источник по идентификатору (для опроса статуса)
      operationId: getSource
      responses:
        '200':
          description: Источник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ Sources ]
      summary: Удалить источник
      description: Единый текст темы пересобирается без этого источника.
      operationId: deleteSource
      responses:
        '204':
          description: Источник удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sources/{sourceId}/text:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [ Sources ]
      summary: Исходный и извлечённый текст источника
      operationId: getSourceText
      responses:
        '200':
          description: Тексты источника
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceTextDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/topics/{topicId}/content:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [ TopicContent ]
      summary: Актуальный единый текст темы
      operationId: getTopicContent
      responses:
        '200':
          description: Последняя версия единого текста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicContentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Некорректный запрос (VALIDATION_FAILED, MALFORMED_REQUEST, UNSUPPORTED_FILE_TYPE, INVALID_YOUTUBE_URL)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Нет валидного токена (UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено (TOPIC_NOT_FOUND, SOURCE_NOT_FOUND, TOPIC_CONTENT_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TopicStatus:
      type: string
      description: DRAFT — нет источников, PROCESSING — идёт обработка, READY — есть готовый текст, ERROR — ни один источник не обработан
      enum: [ DRAFT, PROCESSING, READY, ERROR ]

    SourceType:
      type: string
      enum: [ PDF, YOUTUBE, TEXT, WORD_LIST ]

    TextSourceType:
      type: string
      enum: [ TEXT, WORD_LIST ]

    SourceStatus:
      type: string
      enum: [ UPLOADED, PROCESSING, READY, ERROR ]

    CreateTopicRequest:
      type: object
      required: [ title ]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Spring Security
        description:
          type: string
          maxLength: 2000

    UpdateTopicRequest:
      type: object
      description: Передаются только изменяемые поля
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000

    TopicDto:
      type: object
      required: [ id, title, status, createdAt, updatedAt ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/TopicStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TextSourceRequest:
      type: object
      required: [ text ]
      properties:
        type:
          $ref: '#/components/schemas/TextSourceType'
        name:
          type: string
          maxLength: 255
        text:
          type: string
          minLength: 1
          maxLength: 1000000

    YoutubeSourceRequest:
      type: object
      required: [ url ]
      properties:
        url:
          type: string
          maxLength: 2048
          example: https://www.youtube.com/watch?v=dQw4w9WgXcQ
        name:
          type: string
          maxLength: 255

    SourceDto:
      type: object
      required: [ id, topicId, type, status, createdAt, updatedAt ]
      properties:
        id:
          type: string
          format: uuid
        topicId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SourceType'
        status:
          $ref: '#/components/schemas/SourceStatus'
        originalName:
          type: string
        originalUrl:
          type: string
        errorCode:
          type: string
          description: TEXT_EXTRACTION_FAILED, TRANSCRIPT_UNAVAILABLE, SOURCE_PROCESSING_FAILED
        errorMessage:
          type: string
        extractedTextLength:
          type: integer
          description: Длина извлечённого текста в символах
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SourceTextDto:
      type: object
      required: [ sourceId ]
      properties:
        sourceId:
          type: string
          format: uuid
        originalText:
          type: string
          description: Исходный текст (для TEXT и WORD_LIST), никогда не меняется
        extractedText:
          type: string
          description: Текст после извлечения и технической очистки

    TopicContentDto:
      type: object
      required: [ topicId, version, content, createdAt ]
      properties:
        topicId:
          type: string
          format: uuid
        version:
          type: integer
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [ code, message, timestamp ]
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

openapi: 3.0.3
info:
  title: Памятно — Identity API
  description: Регистрация, вход и профиль текущего пользователя.
  version: 1.0.0
servers:
  - url: http://localhost:8080

tags:
  - name: Auth
    description: Регистрация и вход
  - name: Users
    description: Текущий пользователь

paths:
  /api/auth/register:
    post:
      tags: [ Auth ]
      summary: Регистрация пользователя
      description: Создаёт пользователя и сразу выдаёт access-токен.
      operationId: register
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Регистрация отключена (REGISTRATION_DISABLED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email уже зарегистрирован (EMAIL_ALREADY_REGISTERED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [ Auth ]
      summary: Вход по email и паролю
      operationId: login
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверный email или пароль (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/me:
    get:
      tags: [ Users ]
      summary: Профиль текущего пользователя
      operationId: getCurrentUser
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  responses:
    BadRequest:
      description: Некорректный запрос (VALIDATION_FAILED, MALFORMED_REQUEST)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Нет валидного токена (UNAUTHORIZED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: student@example.com
        password:
          type: string
          minLength: 8
          maxLength: 72
          example: correct-horse-battery

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 72

    AuthTokenDto:
      type: object
      required: [ accessToken, tokenType, expiresIn, userId ]
      properties:
        accessToken:
          type: string
          description: JWT для заголовка Authorization
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Время жизни токена в секундах
        userId:
          type: string
          format: uuid

    UserDto:
      type: object
      required: [ id, email, createdAt ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [ code, message, timestamp ]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
        timestamp:
          type: string
          format: date-time
